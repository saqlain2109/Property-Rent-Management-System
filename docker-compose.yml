# Production Docker Compose Configuration for Property & Rent Management
services:
  # 1. MongoDB Database
  mongodb:
    image: mongo:6-alpine
    container_name: estate_mongodb
    restart: unless-stopped
    environment:
      - MONGO_INITDB_DATABASE=property_mgmt
    volumes:
      - mongo_data:/data/db
    networks:
      - estate_net

  # 2. Node.js Express Backend
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: estate_backend
    restart: unless-stopped
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/property_mgmt
      - NODE_ENV=production
      - JWT_SECRET=estate_jwt_secret_key_change_in_production_123!
    depends_on:
      - mongodb
    volumes:
      - server_uploads:/app/uploads
    networks:
      - estate_net

  # 3. React Frontend served via Nginx (Reverse Proxy for /api)
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: estate_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - estate_net

volumes:
  mongo_data:
  server_uploads:

networks:
  estate_net:
    driver: bridge
